<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Мій відділ — WorkHub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>

  <link rel="stylesheet" href="../css/style.css"/>
  <link rel="stylesheet" href="../css/app.css"/>
  <link rel="stylesheet" href="../css/my-space.css"/>
  <link rel="stylesheet" href="../css/department.css"/>
  <link rel="stylesheet" href="../css/final.css"/>
</head>
<body class="app-body">

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <a href="../index.html" class="nav-logo">
        <div class="logo-icon">W</div><span>WorkHub</span>
      </a>
      <button class="sidebar-close" onclick="toggleSidebar()">✕</button>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-section-label">Головне</div>
      <a href="dashboard.html"  class="sidebar-link"><span class="sl-icon">📊</span> Дашборд</a>
      <a href="my-space.html"   class="sidebar-link"><span class="sl-icon">👤</span> Мій простір</a>
      <a href="tasks.html"      class="sidebar-link"><span class="sl-icon">✅</span> Задачі</a>
      <a href="notes.html"      class="sidebar-link"><span class="sl-icon">📝</span> Нотатки</a>
      <div class="nav-section-label">Відділ</div>
      <a href="department.html" class="sidebar-link active"><span class="sl-icon">📁</span> Мій відділ</a>
      <a href="docs.html"       class="sidebar-link"><span class="sl-icon">📄</span> Документи</a>
      <a href="team.html"       class="sidebar-link"><span class="sl-icon">👥</span> Команда</a>
    </nav>
    <div class="sidebar-footer">
      <div class="sidebar-user" id="sidebarUser"></div>
      <button class="sidebar-logout" onclick="logout()">
        <span>🚪</span> Вийти
      </button>
    </div>
  </aside>

  <div class="app-main">
    <header class="app-topbar">
      <button class="topbar-burger" onclick="toggleSidebar()">☰</button>
      <div class="topbar-title" id="deptTopbarTitle">Мій відділ</div>
      <div class="topbar-right">
        <div class="topbar-user" id="topbarUser"></div>
      </div>
    </header>

    <main class="app-content">

      <!-- Шапка відділу -->
      <div class="dept-hero" id="deptHero">
        <div class="dept-hero-icon" id="deptHeroIcon"></div>
        <div class="dept-hero-info">
          <h1 id="deptHeroName"></h1>
          <p id="deptHeroDesc"></p>
        </div>
        <div class="dept-hero-stats" id="deptHeroStats"></div>
      </div>

      <!-- Вкладки -->
      <div class="space-tabs">
        <button class="space-tab active" onclick="switchDeptTab('news', this)">📢 Новини відділу</button>
        <button class="space-tab" onclick="switchDeptTab('tasks', this)">✅ Задачі відділу</button>
        <button class="space-tab" onclick="switchDeptTab('docs', this)">📄 Документи</button>
      </div>

      <!-- Новини відділу -->
      <div id="deptTabNews" class="tab-content">
        <div class="dept-news-grid" id="deptNewsList"></div>
      </div>

      <!-- Задачі відділу -->
      <div id="deptTabTasks" class="tab-content" style="display:none">
        <div class="app-card">
          <div class="app-card-header">
            <h3>Всі задачі відділу</h3>
            <div id="deptTasksManagerBtn"></div>
          </div>
          <div id="deptTasksList"></div>
        </div>
      </div>

      <!-- Документи відділу -->
      <div id="deptTabDocs" class="tab-content" style="display:none">
        <div class="app-card">
          <div class="app-card-header">
            <h3>Документи відділу</h3>
          </div>
          <div id="deptDocsList"></div>
        </div>
      </div>

    </main>
  </div>

  <div class="toast" id="toast"></div>

  <script src="../js/data.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/department.js"></script>
  <script>
    const session = requireEmployee();
    if (session) initDepartment(session);
  </script>
</body>
</html>
